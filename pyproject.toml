[project]
name = "pseudotimede-py"
version = "0.0.2"
authors = [
  { name="Kris Sankaran", email="sankaran.kris@gmail.com" },
]
description = "Python implementation of the PseudotimeDE algorithm for differential expression analysis on estimated pseudotimes. Uses scDesigner for simulation model estimation."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anndata",
    "formulaic",
    "numpy",
    "pandas",
    "scipy",
    "scdesigner",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudotimede_py"]
